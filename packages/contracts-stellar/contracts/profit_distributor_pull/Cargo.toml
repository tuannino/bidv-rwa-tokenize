[package]
name = "profit-distributor-pull"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
wpt-token = { path = "../wpt_token" }
revenue-oracle = { path = "../revenue_oracle" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
wpt-token = { path = "../wpt_token" }
revenue-oracle = { path = "../revenue_oracle" }
