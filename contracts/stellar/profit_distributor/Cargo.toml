[package]
name = "profit-distributor"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
# Dùng lại client sinh tự động của hợp đồng token để gọi chéo hợp đồng.
spt-token = { path = "../spt_token" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
spt-token = { path = "../spt_token", features = [] }
