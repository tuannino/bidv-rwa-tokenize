[package]
name = "redemption"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
spt-token = { path = "../spt_token" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
spt-token = { path = "../spt_token" }
