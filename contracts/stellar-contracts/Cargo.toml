[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.dependencies]
soroban-sdk = "26"

# Cấu hình build tối ưu kích thước WASM cho hợp đồng Soroban.
# Lưu ý: luôn build bằng `stellar contract build`, KHÔNG dùng `cargo build`.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
