# Chế độ VPS — dựng toàn bộ PoC bằng 1 lệnh:  docker compose up
# Mục tiêu: mint chạy được ngay với chain hardhat-local + tích hợp mock.
#
# Chế độ còn lại (free-tier serverless, KHÔNG có container nào) xem docs/DEPLOYMENT.md.
# Cùng một codebase, chỉ khác feature-flag.

services:
  chain:
    build:
      context: ./packages/contracts-evm
    # entrypoint.sh: chạy hardhat node, CHỜ RPC sẵn sàng, rồi deploy + ghi addresses.json.
    ports:
      - "8545:8545"
    volumes:
      # Bind-mount để addresses.json/ABI sinh ra nhìn thấy được ngay trên host (git diff).
      - ./packages/shared:/shared
    healthcheck:
      # Chờ tới khi ProjectToken đã deploy, không chỉ khi cổng mở.
      test:
        - CMD-SHELL
        - >-
          wget -q -O- --header='Content-Type: application/json'
          --post-data='{"jsonrpc":"2.0","id":1,"method":"eth_getCode","params":["0x5FbDB2315678afecb367f032d93F642f64180aa3","latest"]}'
          http://127.0.0.1:8545 | grep -q '0x60'
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bidv
      POSTGRES_PASSWORD: bidv
      POSTGRES_DB: bidv_rwa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidv -d bidv_rwa"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        # RPC mà BROWSER gọi — cổng đã publish trên host, khác RPC của server bên dưới.
        NEXT_PUBLIC_RPC_HARDHAT: http://localhost:8545
        NEXT_PUBLIC_DEFAULT_CHAIN: hardhat-local
    depends_on:
      chain:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_DEFAULT_CHAIN: hardhat-local
      # RPC mà SERVER gọi (trong mạng compose).
      RPC_HARDHAT: http://chain:8545
      DATABASE_URL: postgresql://bidv:bidv@db:5432/bidv_rwa
      # Khóa test công khai của Hardhat account #0 — chỉ dùng cho hardhat-local.
      SERVER_SIGNER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      SIGNER_KIND: server
      USE_MOCK_KYC: "true"
      USE_MOCK_ORACLE: "true"
      USE_MOCK_COREBANK: "true"
      # Chế độ VPS có Postgres thật -> lưu Txn/audit vào DB.
      USE_MOCK_DB: "false"
      DEMO_ROLE: BANK_ADMIN
    ports:
      - "3000:3000"

volumes:
  pgdata:
