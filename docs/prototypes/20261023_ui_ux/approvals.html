<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phê duyệt lệnh BIDV RWA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="proto.css">
</head>
<body data-role="controller" data-page="approvals">
<div class="app">
  <main class="canvas" id="main">
    <div class="title-row">
      <div>
        <h1>Phê duyệt lệnh</h1>
        <p class="sub" id="finding"></p>
      </div>
      <div class="title-actions"><span class="stamp" id="stamp"></span></div>
    </div>

    <div class="queue">
      <section class="panel list" aria-labelledby="list-h">
        <h2 class="sr-only" id="list-h">Danh sách yêu cầu</h2>
        <div class="toolbar">
          <div class="tabs" role="tablist" id="tabs"></div>
          <label class="search"><span class="sr-only">Tìm yêu cầu</span><span id="search-ic"></span><input type="search" id="q" placeholder="Mã, người lập, lý do, chứng từ"></label>
        </div>
        <table aria-labelledby="list-h">
          <colgroup><col style="width: 30%"><col style="width: 12%"><col style="width: 18%"><col style="width: 14%"><col style="width: 26%"></colgroup>
          <thead><tr><th>Yêu cầu</th><th>Loại</th><th class="n">Số lượng</th><th>Người lập</th><th class="n" id="age-h">Đã chờ</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>

      <section class="panel detail" aria-live="polite" id="detail"></section>
    </div>
  </main>
</div>
<script src="data.js"></script>
<script src="shell.js"></script>
<script>
(() => {
  const { token, requests, pending, decided, updatedAt } = DATA;
  const $ = (id) => document.getElementById(id);
  const oldest = [...pending].sort((a, b) => b.minutes - a.minutes)[0];
  $('finding').innerHTML = `${pending.length} yêu cầu đang chờ trên ${token.chain}; cũ nhất là <strong>${oldest.kind === 'MINT' ? 'tạo' : 'huỷ'} ${F.int(oldest.amount)} WPT</strong>, đã chờ ${F.wait(oldest.minutes)}. Chấp nhận thì hệ thống kiểm lại điều kiện rồi gửi giao dịch ngay.`;
  $('stamp').textContent = `Cập nhật ${updatedAt}`;
  $('search-ic').innerHTML = icon('search');

  const views = [
    { key: 'pending', label: 'Chờ duyệt', rows: () => [...pending].sort((a, b) => b.minutes - a.minutes) },
    { key: 'decided', label: 'Đã xử lý hôm nay', rows: () => decided },
  ];
  let view = 0, selected = location.hash.slice(1) || oldest.id;
  const kindLabel = (r) => (r.kind === 'MINT' ? 'Tạo token' : 'Huỷ token');
  const statusPill = (r) => ({ PENDING: '<span class="pill warn">Chờ duyệt</span>', COMPLETED: '<span class="pill pos">Đã phát hành</span>', REJECTED: '<span class="pill neg">Đã từ chối</span>' })[r.status];

  const renderTabs = () => { $('tabs').innerHTML = views.map((v, i) => `<button role="tab" aria-selected="${i === view}" data-i="${i}">${v.label} <span class="grey">${v.rows().length}</span></button>`).join(''); };
  const renderRows = () => {
    const q = $('q').value.trim().toLowerCase();
    const rows = views[view].rows().filter((r) => !q || [r.id, r.maker, r.reason, r.doc].join(' ').toLowerCase().includes(q));
    $('age-h').textContent = view === 0 ? 'Đã chờ' : 'Kết quả';
    $('rows').innerHTML = rows.length ? rows.map((r) => `
      <tr data-id="${r.id}" aria-selected="${r.id === selected}" tabindex="0">
        <td><span class="mono">${r.id}</span><span class="sub truncate">${r.reason}</span></td>
        <td class="c-hide"><span class="kind${r.kind === 'BURN' ? ' burn' : ''}">${r.kind === 'MINT' ? 'Tạo' : 'Huỷ'}</span></td>
        <td class="n"><b style="font-weight:500">${F.int(r.amount)}</b> <span class="grey">WPT</span><span class="sub ph-only">${r.kind === 'MINT' ? 'Tạo' : 'Huỷ'}, ${r.maker}</span></td>
        <td class="c-hide">${r.maker}</td>
        <td class="n c-hide">${r.status === 'PENDING' ? `<span class="${r.minutes > 120 ? 'neg' : ''}">${F.wait(r.minutes)}</span>` : statusPill(r)}</td>
      </tr>`).join('') : `<tr><td colspan="5"><div class="empty">Không có yêu cầu nào khớp "${q}".</div></td></tr>`;
  };

  const check = (ok, text, note) => `<li class="${ok ? '' : 'fail'}">${icon(ok ? 'check' : 'x')}<span>${text}${note ? `<small>${note}</small>` : ''}</span></li>`;
  const renderDetail = () => {
    const r = requests.find((x) => x.id === selected);
    if (!r) { $('detail').innerHTML = '<div class="empty">Chọn một yêu cầu để xem chi tiết.</div>'; return; }
    const mint = r.kind === 'MINT';
    const after = token.totalSupply + (mint ? r.amount : -r.amount);
    const checks = mint ? [
      check(true, 'Token WPT đang hoạt động', 'Không ở giai đoạn tất toán'),
      check(true, 'Người duyệt khác người lập', `${r.maker} lập, bạn là KSV001`),
      check(after <= token.cap, 'Không vượt trần phát hành', `${F.int(after)} trên trần ${F.int(token.cap)} WPT`),
      check(true, 'Ví đích là vault SPV đã đăng ký', 'SpvPaymentVault 0x0da9…6861'),
      check(true, 'Ví máy chủ có quyền phát hành', 'MINTER_ROLE trên ProjectToken'),
    ] : [
      check(true, 'Token WPT đang hoạt động'),
      check(true, 'Người duyệt khác người lập', `${r.maker} lập, bạn là KSV001`),
      check(r.amount <= token.unsold, 'Đủ WPT chưa phân phối để huỷ', `Vault đang giữ ${F.int(token.unsold)} WPT chưa bán`),
      check(true, 'Ví máy chủ có quyền huỷ', 'BURNER_ROLE trên ProjectToken'),
    ];
    const decidedBlock = r.status === 'PENDING' ? `
      <div class="decide">
        <button class="btn primary" type="button" id="accept">Chấp nhận và ${mint ? 'phát hành' : 'huỷ'}</button>
        <button class="btn" type="button" id="reject">Từ chối</button>
        <div class="reject-box" id="reject-box"><label class="field"><span>Lý do từ chối</span><textarea id="reject-reason" placeholder="Người lập sẽ thấy lý do này"></textarea></label><button class="btn" type="button" id="reject-send" disabled>Gửi từ chối</button></div>
        <p class="hint">Chấp nhận là gửi giao dịch ${mint ? 'mint' : 'burn'} trên ${token.chain} bằng ví máy chủ. Không hoàn tác được trên giao diện.</p>
      </div>` : `<h3>Kết quả</h3><dl class="kv"><div><dt>Người duyệt</dt><dd>${r.checker}</dd></div><div><dt>Lúc</dt><dd>${r.decidedAt}</dd></div>${r.tx ? `<div><dt>Giao dịch</dt><dd class="mono">${r.tx}</dd></div>` : `<div><dt>Lý do từ chối</dt><dd>${r.rejectReason}</dd></div>`}</dl>`;
    $('detail').innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><h2>${kindLabel(r)} ${F.int(r.amount)} WPT</h2>${statusPill(r)}</div>
      <div class="idline"><span class="mono">${r.id}</span><button class="copy" type="button" aria-label="Chép mã yêu cầu" data-copy="${r.id}">${icon('copy')}</button></div>
      <dl class="kv" style="margin-top:12px">
        <div><dt>Người lập</dt><dd>${r.maker}, ${r.createdAt}</dd></div>
        ${r.source ? `<div><dt>Nguồn huỷ</dt><dd>${r.source}</dd></div>` : `<div><dt>Ví đích</dt><dd>Vault SPV <span class="mono grey">0x0da9…6861</span></dd></div>`}
        <div><dt>Ngày hiệu lực</dt><dd>${r.effective}</dd></div>
        <div><dt>Chứng từ</dt><dd>${r.doc}</dd></div>
        <div><dt>Lý do</dt><dd>${r.reason}</dd></div>
      </dl>
      <div class="after"><span class="grey">Tổng cung sau khi duyệt</span><span class="figure">${F.int(after)} <span class="grey" style="font-size:13px">WPT</span></span><span class="grey" style="font-size:12px">Hiện tại ${F.int(token.totalSupply)} WPT</span><span class="${mint ? 'pos' : 'grey'}" style="font-size:12px;text-align:right">${F.signed(after - token.totalSupply)} WPT</span></div>
      <h3>Hệ thống đã kiểm ${checks.length} điều kiện</h3>
      <ul class="checks">${checks.join('')}</ul>
      ${decidedBlock}`;
    const rej = $('reject');
    if (rej) {
      rej.addEventListener('click', () => { $('reject-box').classList.add('open'); $('reject-reason').focus(); });
      $('reject-reason').addEventListener('input', (e) => { $('reject-send').disabled = e.target.value.trim().length < 5; });
      $('accept').addEventListener('click', (e) => { e.currentTarget.textContent = 'Đang gửi giao dịch…'; e.currentTarget.disabled = true; });
    }
  };

  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; view = +b.dataset.i; selected = views[view].rows()[0]?.id; renderTabs(); renderRows(); renderDetail(); });
  const pick = (tr) => { if (!tr?.dataset.id) return; selected = tr.dataset.id; history.replaceState(null, '', '#' + selected); renderRows(); renderDetail(); if (matchMedia('(max-width: 1180px)').matches) $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  $('rows').addEventListener('click', (e) => pick(e.target.closest('tr')));
  $('rows').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e.target.closest('tr')); } });
  $('q').addEventListener('input', renderRows);
  document.addEventListener('click', (e) => { const c = e.target.closest('[data-copy]'); if (c) navigator.clipboard?.writeText(c.dataset.copy).catch(() => {}); });
  renderTabs(); renderRows(); renderDetail();
})();
</script>
</body>
</html>
