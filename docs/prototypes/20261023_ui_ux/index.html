<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng điều khiển BIDV RWA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="proto.css">
</head>
<body data-role="controller" data-page="dashboard">
<div class="app">
  <main class="canvas" id="main">
    <div class="title-row">
      <div>
        <h1>Bảng điều khiển</h1>
        <p class="sub" id="finding"></p>
      </div>
      <div class="title-actions">
        <span class="stamp" id="stamp"></span>
        <a class="btn primary" href="#" id="approve-dist"></a>
      </div>
    </div>

    <section class="panel flow" aria-labelledby="flow-h">
      <header><h2 id="flow-h"></h2><span class="meta">Chia theo tổng cung tại ảnh chụp; phần của WPT chưa bán trả về vault</span></header>
      <div class="flow-nodes" id="flow"></div>
    </section>

    <div class="grid section-gap">
      <section class="panel" style="grid-column: span 8" aria-labelledby="trend-h">
        <header><h2 id="trend-h">Sáu kỳ gần nhất</h2><span class="meta" id="trend-range"></span></header>
        <div class="kpis" role="tablist" aria-label="Chọn chỉ số" id="tabs"></div>
        <div class="chart" id="trend" style="height: 200px"></div>
        <table class="cmp" aria-label="So sánh với kỳ trước">
          <thead><tr><th id="cmp-h">Chỉ số</th><th class="n" id="cmp-prev"></th><th class="n" id="cmp-cur"></th><th class="n">Thay đổi</th></tr></thead>
          <tbody id="cmp"></tbody>
        </table>
      </section>

      <section class="panel todo stretch" style="grid-column: span 4" aria-labelledby="todo-h">
        <header><h2 id="todo-h">Chờ bạn xử lý</h2><span class="meta" id="todo-count"></span></header>
        <div class="rows" id="todo"></div>
        <footer><a class="card-link" href="approvals.html">Mở hàng chờ duyệt</a></footer>
      </section>
    </div>

    <div class="grid section-gap top">
      <section class="panel" style="grid-column: span 8" aria-labelledby="hist-h">
        <header><h2 id="hist-h">Lịch sử kỳ chia</h2><a class="card-link" href="#">Xem tất cả</a></header>
        <div class="table-wrap"><table class="hist">
          <thead><tr><th>Kỳ</th><th class="n">Sản lượng</th><th class="n">Mỗi WPT nhận</th><th class="n">Quỹ của kỳ</th><th class="n">Ngày chia</th><th>Trạng thái</th></tr></thead>
          <tbody id="hist"></tbody>
        </table></div>
      </section>
      <section class="panel" style="grid-column: span 4" aria-labelledby="vault-h">
        <header><h2 id="vault-h">Nguồn cung và vault SPV</h2></header>
        <dl class="kv" id="vault"></dl>
      </section>
    </div>
  </main>
</div>
<script src="data.js"></script>
<script src="charts.js"></script>
<script src="shell.js"></script>
<script>
(() => {
  const { token, periods, current: cur, previous: prev, updatedAt, pending, withdrawReview, vault } = DATA;
  const $ = (id) => document.getElementById(id);
  const oldest = Math.max(...pending.map((r) => r.minutes));
  $('finding').innerHTML = `Kỳ ${cur.label} đã chốt vault, chờ bạn duyệt chia <strong>${F.int(cur.fund)} VNDB</strong>. ${pending.length} yêu cầu phát hành hoặc huỷ token đang chờ, cũ nhất ${F.wait(oldest)}.`;
  $('stamp').textContent = `Cập nhật ${updatedAt}`;
  $('approve-dist').textContent = `Duyệt chia kỳ ${cur.label}`;

  // Dải đặc trưng: một kỳ chia đi từ sản lượng tới ví nhà đầu tư và vault.
  $('flow-h').textContent = `Kỳ ${cur.label} chia thế nào`;
  const invShare = cur.toInvestors / cur.fund;
  $('flow').innerHTML = `
    <div class="node"><div class="lbl">Sản lượng điện</div><div class="val">${F.int(cur.mwh)}<span class="unit">MWh</span></div><div class="cap">Nguồn EnergyOracle</div></div>
    <div class="link" aria-hidden="true"></div>
    <div class="node"><div class="lbl">Lợi nhuận nạp quỹ</div><div class="val">${F.ty(cur.fund)}<span class="unit">tỷ VNDB</span></div><div class="cap">${F.int(cur.fund)} VNDB chưa phân bổ</div></div>
    <div class="link" aria-hidden="true"></div>
    <div class="node"><div class="lbl">Mỗi WPT nhận</div><div class="val">${F.int(cur.perWpt)}<span class="unit">VNDB</span></div><div class="cap">Chia cho ${F.int(token.totalSupply)} WPT tổng cung</div></div>
    <div class="link" aria-hidden="true"></div>
    <div class="node split-node"><div class="split">
      <div class="part"><span>Nhà đầu tư<small>${F.int(token.circulating)} WPT đang lưu hành</small></span><span class="val">${F.int(cur.toInvestors)}<span class="unit">VNDB</span></span><span class="bar"><i style="width:${(invShare * 100).toFixed(1)}%"></i></span></div>
      <div class="part"><span>Vault SPV<small>${F.int(token.unsold)} WPT chưa bán</small></span><span class="val">${F.int(cur.toVault)}<span class="unit">VNDB</span></span><span class="bar vault"><i style="width:${((1 - invShare) * 100).toFixed(1)}%"></i></span></div>
    </div></div>`;

  // Thẻ xu hướng: ba chỉ số làm tab của biểu đồ cột, kỳ hiện tại tô xanh BIDV.
  const metrics = [
    { key: 'mwh', label: 'Sản lượng', unit: 'MWh', fmt: F.int, axis: Charts.fmt.int },
    { key: 'perWpt', label: 'Mỗi WPT nhận', unit: 'VNDB', fmt: F.int, axis: Charts.fmt.int },
    { key: 'fund', label: 'Lợi nhuận nạp quỹ', unit: 'tỷ VNDB', fmt: F.ty, scale: 1e9, axis: (v) => Charts.fmt.dec(1)(v) },
  ];
  $('trend-range').textContent = `${periods[0].label} đến ${cur.label}`;
  $('tabs').innerHTML = metrics.map((m, i) => `<button class="kpi" role="tab" aria-selected="${i === 0}" data-i="${i}"><div class="kpi-label">${m.label} ${cur.label}</div><div class="kpi-value">${m.fmt(cur[m.key])}<span class="unit">${m.unit}</span></div></button>`).join('');
  const draw = (i) => {
    const m = metrics[i], old = $('trend'), el = old.cloneNode(false);
    old.replaceWith(el);
    Charts.bars(el, { labels: periods.map((p) => p.label), values: periods.map((p) => p[m.key] / (m.scale || 1)), highlight: periods.length - 1, height: 200, format: (v) => `${m.scale ? F.dec(2)(v) : F.int(v)} ${m.unit}`, tickFormat: m.axis });
    document.querySelectorAll('#tabs .kpi').forEach((b) => b.setAttribute('aria-selected', String(+b.dataset.i === i)));
  };
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('.kpi'); if (b) draw(+b.dataset.i); });
  $('tabs').addEventListener('keydown', (e) => {
    if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    const tabs = [...document.querySelectorAll('#tabs .kpi')], at = tabs.indexOf(document.activeElement);
    const next = (at + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length; tabs[next].focus(); draw(next);
  });
  draw(0);

  // So sánh với kỳ trước: thay đổi tính từ đúng hai giá trị đang hiện. Giảm là xấu cho nhà đầu tư nên tô đỏ.
  $('cmp-h').textContent = `Kỳ ${cur.label} so với kỳ ${prev.label}`;
  $('cmp-prev').textContent = prev.label; $('cmp-cur').textContent = cur.label;
  $('cmp').innerHTML = metrics.map((m) => {
    const a = m.scale ? +F.ty(prev[m.key]).replace(',', '.') : prev[m.key], b = m.scale ? +F.ty(cur[m.key]).replace(',', '.') : cur[m.key];
    const d = +(b - a).toFixed(2), pct = d / a;
    const ds = m.scale ? (d > 0 ? '+' : d < 0 ? '−' : '') + F.dec(2)(Math.abs(d)) : F.signed(d);
    return `<tr><td>${m.label} <span class="grey">(${m.unit})</span></td><td class="n grey">${m.fmt(prev[m.key])}</td><td class="n">${m.fmt(cur[m.key])}</td><td class="n ${d < 0 ? 'neg' : d > 0 ? 'pos' : 'grey'}"><span class="nowrap">${ds} <span class="grey">(${F.signedPct(pct)})</span></span></td></tr>`;
  }).join('');

  // Việc chờ: yêu cầu cũ nhất trước, quá 2 giờ thì số giờ chờ tô đỏ.
  const kindLabel = (r) => (r.kind === 'MINT' ? 'Tạo' : 'Huỷ');
  $('todo-count').textContent = `${pending.length + 2} việc`;
  $('todo').innerHTML = `
    <a class="row" href="#"><div class="what"><b>Duyệt chia kỳ ${cur.label}</b><span>${F.int(cur.fund)} VNDB, vault đã chốt kỳ</span></div><div class="age"><span class="pill warn">Chờ duyệt</span></div></a>` + [...pending].sort((a, b) => b.minutes - a.minutes).map((r) => `
    <a class="row" href="approvals.html#${r.id}"><div class="what"><b>${kindLabel(r)} ${F.int(r.amount)} WPT</b><span>${r.maker} lập yêu cầu <span class="mono">${r.id}</span></span></div><div class="age${r.minutes > 120 ? ' old' : ''}">chờ ${F.wait(r.minutes)}</div></a>`).join('') + `
    <a class="row" href="#"><div class="what"><b>Lệnh rút ${F.int(withdrawReview.amount)} VNDB</b><span>${withdrawReview.who}: ${withdrawReview.note.toLowerCase()}</span></div><div class="age"><span class="pill warn">Cần xem</span></div></a>`;

  $('hist').innerHTML = [...periods].reverse().map((p) => `<tr><td class="c-id">${p.label}</td><td class="n c-m1">${F.int(p.mwh)} <span class="grey">MWh</span></td><td class="n c-key">${F.int(p.perWpt)} <span class="grey">VNDB</span></td><td class="n c-m2">${F.int(p.fund)}<span class="ph"> VNDB</span></td><td class="n c-m3">${p.paidOn ?? '<span class="grey">Chưa chia</span>'}</td><td class="c-st">${p.paidOn ? '<span class="pill pos">Đã chia</span>' : '<span class="pill warn">Chờ duyệt</span>'}</td></tr>`).join('');

  const kv = [
    ['Tổng cung', `${F.int(token.totalSupply)} <span class="grey">/ ${F.int(token.cap)} WPT</span>`],
    ['Đang lưu hành', `${F.int(token.circulating)} WPT`],
    ['Chưa bán, trong vault', `${F.int(token.unsold)} WPT`],
    ['Người nắm giữ', `${F.int(token.holders)} ví`],
    ['Số dư VNDB trong vault', `${F.int(vault.vndb)}`],
    [`Đang khoá ${F.pct(vault.lockPct, 0)} thu ròng`, `${F.int(vault.locked)}`],
    ['Người bán rút được', `${F.int(vault.free)}`],
    ['Chốt kỳ vault gần nhất', `Kỳ ${cur.label}, 22/10/2026`],
    ['Ví nhận tiền rút', '<span class="mono">0x41c2…9e07</span>'],
  ];
  console.assert(vault.locked + vault.free === vault.vndb, 'vault');
  $('vault').innerHTML = kv.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
})();
</script>
</body>
</html>
