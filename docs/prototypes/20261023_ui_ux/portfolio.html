<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tài sản nhà đầu tư BIDV RWA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="proto.css">
</head>
<body data-role="investor" data-page="portfolio">
<div class="app">
  <main class="canvas" id="main">
    <div class="title-row">
      <div>
        <h1>Tài sản của bạn</h1>
        <p class="sub" id="finding"></p>
      </div>
      <div class="title-actions"><span class="stamp" id="stamp"></span></div>
    </div>

    <div class="wallet">
      <div>
        <section class="panel balance" aria-labelledby="bal-h">
          <h2 class="sr-only" id="bal-h">Tổng tài sản</h2>
          <div class="lead" id="total"></div>
          <p id="total-line"></p>
        </section>
        <nav class="actions" aria-label="Thao tác nhanh" id="actions"></nav>
        <section class="panel section-gap" aria-labelledby="assets-h">
          <header><h2 id="assets-h">Token và tiền trong ví</h2><span class="meta mono" id="addr"></span></header>
          <table class="assets">
            <thead><tr><th>Tài sản</th><th class="n">Số lượng</th><th class="n">Giá trị</th></tr></thead>
            <tbody id="assets"></tbody>
          </table>
        </section>
        <section class="panel section-gap" aria-labelledby="proj-h">
          <header><h2 id="proj-h">Dự án bạn đang nắm giữ</h2><span class="meta" id="proj-meta"></span></header>
          <dl class="kv" id="project"></dl>
        </section>
      </div>

      <div>
        <section class="panel" aria-labelledby="pay-h">
          <header><h2 id="pay-h">Lợi tức đã nhận</h2><span class="meta" id="pay-range"></span></header>
          <div class="chart" id="payouts" style="height: 196px"></div>
          <div class="target" id="target"></div>
        </section>
        <section class="panel section-gap activity" aria-labelledby="act-h">
          <header><h2 id="act-h">Hoạt động gần đây</h2><a class="card-link" href="#">Lệnh của tôi</a></header>
          <div class="rows" id="activity"></div>
        </section>
      </div>
    </div>
  </main>
</div>
<script src="data.js"></script>
<script src="charts.js"></script>
<script src="shell.js"></script>
<script>
(() => {
  const { token, investor: inv, updatedAt } = DATA;
  const $ = (id) => document.getElementById(id);
  const last = inv.payouts.at(-1);
  $('finding').innerHTML = `Lợi tức kỳ ${last.label} đã về ví ngày ${last.paidOn}: <strong>${F.signed(last.amount)} VNDB</strong> cho ${F.int(inv.wpt)} WPT ${token.project}.`;
  $('stamp').textContent = `Cập nhật ${updatedAt}`;
  $('total').innerHTML = `${F.int(inv.total)}<span class="unit">VNDB</span>`;
  $('total-line').innerHTML = `Tổng tài sản, gồm WPT tính theo giá phát hành và VNDB trong ví. Đã nhận <span class="pos">${F.signed(inv.received)} VNDB</span> lợi tức qua ${inv.payouts.length} kỳ.`;
  $('actions').innerHTML = [['plus', 'Mua WPT'], ['minus', 'Bán WPT'], ['banknote', 'Rút VNDB'], ['list', 'Lệnh của tôi']].map(([i, l]) => `<a class="action" href="#">${icon(i)}<span>${l}</span></a>`).join('');
  $('addr').textContent = '0x7099…79C8';
  $('assets').innerHTML = `
    <tr><td><div class="asset"><span class="coin wpt">WPT</span><div><b>${token.symbol}</b><span>${token.project}, ${token.capacityMw.toLocaleString('vi-VN')} MW</span></div></div></td>
      <td class="n"><b>${F.int(inv.wpt)}</b><span class="sub">Giá ${F.int(token.issuePrice)} VNDB</span></td>
      <td class="n"><b>${F.int(inv.wptValue)}</b><span class="sub">VNDB, theo giá phát hành</span><span class="sub ph-only">${F.int(inv.wpt)} WPT nhân ${F.int(token.issuePrice)}</span></td></tr>
    <tr><td><div class="asset"><span class="coin vndb">VNDB</span><div><b>VNDB</b><span>Tiền số 1:1 với VND, rút về tài khoản BIDV</span></div></div></td>
      <td class="n"><b>${F.int(inv.vndb)}</b><span class="sub">VNDB</span></td>
      <td class="n"><b>${F.int(inv.vndb)}</b><span class="sub">VNDB</span></td></tr>`;

  const P = DATA.current;
  $('proj-meta').textContent = token.project;
  $('project').innerHTML = [
    ['Công suất đặt', `${token.capacityMw.toLocaleString('vi-VN')} MW, ${token.turbines} tuabin`],
    [`Sản lượng kỳ ${P.label}`, `${F.int(P.mwh)} MWh`],
    [`Lợi tức mỗi WPT kỳ ${P.label}`, `${F.int(P.perWpt)} VNDB`],
    ['Phần của bạn trong tổng cung', `${F.int(inv.wpt)} / ${F.int(token.totalSupply)} WPT`],
  ].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  $('pay-range').textContent = `${inv.payouts[0].label} đến ${last.label}`;
  Charts.bars($('payouts'), { labels: inv.payouts.map((p) => p.label), values: inv.payouts.map((p) => p.amount), highlight: inv.payouts.length - 1, height: 196, format: (v) => `${F.int(v)} VNDB`, tickFormat: Charts.fmt.int });
  const ratio = inv.yieldPa / token.targetYield;
  $('target').innerHTML = `<p>Tương đương <strong style="font-weight:500">${F.pct(inv.yieldPa, 2)}/năm</strong> trên giá mua, mục tiêu dự án ${F.pct(token.targetYield, 1)}/năm.</p>
    <div class="track" role="img" aria-label="Đạt ${F.pct(ratio, 0)} lợi tức mục tiêu" style="margin-top:10px"><i style="width:${Math.min(1, ratio) * 100}%"></i></div>
    <div class="ends"><span>0%</span><span>Mục tiêu ${F.pct(token.targetYield, 1)}</span></div>`;

  $('activity').innerHTML = inv.activity.map((a) => `<div class="row"><div><b>${a.what}</b><span class="when">${a.on}</span></div><span class="amt ${a.amount > 0 ? 'pos' : ''}">${F.signed(a.amount)} <span class="grey">VNDB</span></span></div>`).join('');
})();
</script>
</body>
</html>
